name: Project 18 - GitHub Actions CI
on:
 push:
   branches:
     - main
 pull_request:
   branches:
     - main
 workflow_dispatch:
permissions:
 contents: read
jobs:
 github-actions:
   name: GitHub Actions CI
   runs-on: ubuntu-latest
   steps:
     - name: Checkout Repository
       uses: actions/checkout@v4
     - name: Verify Git
       run: |
         echo "Repository checkout successful"
         git rev-parse --is-inside-work-tree
     - name: Execute CI Pipeline
       run: |
         echo "Project 18 - GitOps"
         echo "GitHub Actions pipeline started"
         echo "CI execution successful"
         echo "Pipeline completed successfully"
